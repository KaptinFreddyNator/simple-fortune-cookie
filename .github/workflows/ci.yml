name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE_NAME_BACKEND: 9tailedninko/fortune-backend
  IMAGE_NAME_FRONTEND: 9tailedninko/fortune-frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.16'

      - name: Build frontend
        working-directory: frontend
        run: go build

      - name: Run tests
        working-directory: frontend
        run: go test
  
  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
  
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig

      - name: Deploy manifests
        run: kubectl --kubeconfig kubeconfig apply -f kubernetes_manifests/

      - name: Roll out new images
        run: |
          kubectl --kubeconfig kubeconfig rollout restart deployment/backend
          kubectl --kubeconfig kubeconfig rollout restart deployment/frontend

      - name: Wait for rollout
        run: |
          kubectl --kubeconfig kubeconfig rollout status deployment/backend --timeout=90s
          kubectl --kubeconfig kubeconfig rollout status deployment/frontend --timeout=90s



  test:
   needs: deploy
   runs-on: ubuntu-latest
   if: github.event_name == 'push' && github.ref == 'refs/heads/main'

   steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up kubeconfig
      run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig

    - name: Copy test script into cluster and run it
      run: |
        kubectl --kubeconfig kubeconfig run test --image=curlimages/curl --restart=Never --rm -i \
          -- sh -c "curl -sf http://frontend:8080/healthz && curl -sf http://backend:8081/fortunes"
    