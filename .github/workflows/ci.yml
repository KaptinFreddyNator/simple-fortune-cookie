name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.16'

      - name: Build frontend
        working-directory: frontend
        run: go build

      - name: Run tests
        working-directory: frontend
        run: go test